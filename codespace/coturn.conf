# coturn.conf — TURN server configuration for WebRTC Seminar 04
# Course: Multimediaprogrammierung — Chapter 04: WebRTC
# Author: Renato Fera P. — TU Ilmenau AMS Group
#
# coturn is the de facto open-source TURN server, used in production by
# Jitsi, Matrix/Element, and many others. This configuration runs inside
# a GitHub Codespace, which can only forward TCP/TLS ports — not raw UDP.
# Therefore we enable TURNS (TURN over TLS over TCP) on port 5349 and
# disable all UDP and plain-TCP transports.
#
# Reference: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf

# ── Listening ports ───────────────────────────────────────────────────────────

# Standard TURN port (UDP and plain TCP).
# Not reachable via Codespaces port forwarding (which only proxies HTTP/TLS),
# but required by coturn to start cleanly — it is disabled below with no-udp/no-tcp.
listening-port=3478

# TURNS/TLS port. This is the port Codespaces forwards publicly.
# GitHub assigns a *.app.github.dev URL to this port.
# The RTCConfiguration in the demo pages uses this port:
#   urls: 'turns:YOUR_CODESPACE_HOST:5349?transport=tcp'
tls-listening-port=5349

# ── Network interfaces ────────────────────────────────────────────────────────

# Listen on all network interfaces (0.0.0.0 = any IPv4 address).
# Inside a Codespace container, this is necessary to reach the forwarded port.
listening-ip=0.0.0.0

# Relay address: the IP coturn uses as the source address for relayed traffic.
# 0.0.0.0 means coturn picks the appropriate interface for each relay allocation.
relay-ip=0.0.0.0

# ── Realm ────────────────────────────────────────────────────────────────────

# The realm is an arbitrary string that identifies this TURN server.
# It is sent to the client in authentication challenges.
# The realm in coturn.conf must match the realm used in RTCConfiguration if
# you use long-term credentials (lt-cred-mech). For demo use, 'codespace.local'
# is fine. In production, use your domain name (e.g. 'turn.example.com').
realm=codespace.local

# ── Credentials ──────────────────────────────────────────────────────────────

# Long-term credential mechanism (RFC 8489 §9.2).
# Clients authenticate with a static username and password.
# lt-cred-mech activates this mode.
lt-cred-mech

# Static credential for demo use: username=webrtc, password=seminar04.
# These credentials are used in the RTCConfiguration of demos 6 and 7:
#   username: 'webrtc'
#   credential: 'seminar04'
#
# PRODUCTION NOTE: Never use static long-term credentials in production.
# Use time-limited HMAC-SHA1 credentials instead:
#   - Server generates: username = timestamp, password = HMAC-SHA1(secret, timestamp)
#   - Credentials expire after a configurable window (typically 24 hours)
#   - This prevents credential reuse even if they are leaked
# See RFC 8489 §9.2 and the coturn --use-auth-secret option.
user=webrtc:seminar04

# ── Transport: TLS only ───────────────────────────────────────────────────────

# Disable raw UDP. Codespaces port forwarding is HTTP-based and cannot proxy
# UDP datagrams. Disabling UDP prevents coturn from advertising UDP relay
# candidates that would be unreachable from outside the Codespace.
no-udp

# Disable plain (unencrypted) TCP. We only want TLS.
no-tcp

# Disable DTLS (TURN over DTLS). DTLS is used for TURN-over-UDP with TLS;
# since we have no-udp, DTLS is irrelevant here.
no-dtls=true

# TLS is enabled by the presence of cert/pkey and tls-listening-port above.
# No explicit 'tls=true' directive is needed — coturn enables TLS automatically
# when cert and pkey are present and tls-listening-port is set.

# ── TLS certificate ───────────────────────────────────────────────────────────

# Self-signed certificate generated by start.sh using openssl req -x509.
# Both coturn and signaling_server.py share this certificate/key pair.
# WebRTC clients connecting through a Codespace accept the cert because the
# Codespace port-forwarding proxy presents GitHub's trusted certificate to the
# browser — the self-signed cert is only seen hop-to-hop within the Codespace
# network, not by the end user's browser.
#
# In production: replace with a certificate from Let's Encrypt or your CA.
cert=/etc/coturn/turn_server_cert.pem
pkey=/etc/coturn/turn_server_pkey.pem

# ── Logging ───────────────────────────────────────────────────────────────────

# Log to a file inside the Codespace. View with:
#   tail -f /var/log/coturn/turnserver.log
log-file=/var/log/coturn/turnserver.log

# Verbose mode: log every TURN allocation, permission, and channel binding.
# Essential for debugging whether clients are connecting and which relay
# candidate type is being used (host / srflx / relay).
# Disable in production to reduce log volume.
verbose
