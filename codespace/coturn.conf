# coturn.conf — TURN server configuration for WebRTC Seminar 04
# Course: Multimediaprogrammierung — Chapter 04: WebRTC
# Author: Renato Fera P. — TU Ilmenau AMS Group

# ── Listening ports ───────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ── Network interfaces ────────────────────────────────────────────────────────
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# ── Realm ─────────────────────────────────────────────────────────────────────
realm=codespace.local

# ── Long-term credentials (demo use only) ─────────────────────────────────────
lt-cred-mech
user=webrtc:seminar04

# ── Transport: TLS/TCP only ───────────────────────────────────────────────────
# Codespaces port forwarding is HTTP-based and cannot proxy raw UDP.
# We disable UDP and plain TCP and use TURNS (TURN over TLS over TCP) only.
no-udp
no-tcp
no-dtls=true

# ── TLS certificate ───────────────────────────────────────────────────────────
# Generated by start.sh. Directory made writable by onCreateCommand.
cert=/etc/coturn/turn_server_cert.pem
pkey=/etc/coturn/turn_server_pkey.pem

# ── Logging ───────────────────────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
verbose
